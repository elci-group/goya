[package]
name = "nebula"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "COSMIC desktop profile and qualification lane for Emperor."

[lib]
path = "src/lib.rs"

[[bin]]
name = "nebula"
path = "src/main.rs"

[dependencies]
goya-chroma.workspace = true
goya-caprichios.workspace = true
wayland-client = "0.31"
ron = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
