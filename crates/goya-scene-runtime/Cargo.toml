[package]
name = "goya-scene-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Renderer and runtime for admitted GSSH/4-live scenes, shared by Emperor/Nebula scene apps and Viuda."

[dependencies]
goya-lang.workspace = true
goya-executable.workspace = true
goya-gvi.workspace = true
goya-graphics-ir.workspace = true
tiny-skia = "=0.11.4"
ab_glyph = "=0.2.32"
serde_json = "1"
accesskit = { version = "=0.16.3", optional = true }
accesskit_unix = { version = "=0.12.3", optional = true, default-features = false, features = ["tokio"] }

[dev-dependencies]
goya-scene-graphics.workspace = true

[features]
# AccessKit over AT-SPI (Linux desktops). Viuda on webOS has no AT-SPI bus.
a11y = ["dep:accesskit", "dep:accesskit_unix"]
