# Goya CI (audit P1: independently reproducible evidence on every revision)
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace
      - name: Tests (unit + integration; doctests excluded — host rustdoc LLVM issue)
        run: cargo test --workspace --lib --tests
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Format
        run: cargo fmt --all -- --check
      - name: Uni snapshot
        run: |
          if command -v uni >/dev/null 2>&1; then
            uni --fail-under 80 .
          else
            echo "uni not available on runner — recorded locally, enforced in dev gates"
          fi
        continue-on-error: true
