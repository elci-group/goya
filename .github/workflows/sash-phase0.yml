# Sash Phase 0 CI/CD Gate
# This workflow validates Phase 0 completion before allowing Phase 1 to proceed.
# It runs on Linux (for artifact verification) and can trigger Windows self-hosted runners.

name: Sash Phase 0 Validation

on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Architecture to validate (x64, i686, arm64, all)'
        required: true
        default: 'all'
        type: choice
        options: [all, x64, i686, arm64]
      profile:
        description: 'Profile to validate (static-window, interactive-cut, all)'
        required: true
        default: 'all'
        type: choice
        options: [all, static-window, interactive-cut]
      skip_dpi:
        description: 'Skip DPI test (for i686)'
        required: false
        default: false
        type: boolean

  workflow_call:
    inputs:
      arch:
        required: true
        type: string
      profile:
        required: true
        type: string
      skip_dpi:
        required: false
        type: boolean
        default: false
    outputs:
      phase0_status:
        description: 'Overall Phase 0 status'
        value: ${{ jobs.validate.outputs.phase0_status }}
      evidence_path:
        description: 'Path to consolidated evidence'
        value: ${{ jobs.validate.outputs.evidence_path }}

permissions:
  contents: read
  actions: read

env:
  # Artifact paths from SASH-ENT-002
  SASH_ENT002_STATIC_X64: /tmp/sash-ent002/static-window/App.exe
  SASH_ENT002_INTERACTIVE_X64: /tmp/sash-ent002/interactive-cut/App.exe
  SASH_STAMP_STATIC_I686: /tmp/sash-stamp-i686/App.exe
  SASH_STAMP_INTERACTIVE_I686: /tmp/sash-stamp-ix86/App.exe
  SASH_STAMP_STATIC_ARM64: /tmp/sash-stamp-arm64/App.exe
  SASH_STAMP_INTERACTIVE_ARM64: /tmp/sash-stamp-iarm64/App.exe

jobs:
  # Linux-side: verify artifacts exist and are valid before transferring
  # Self-contained CI linking: build every admitted artifact from the
  # committed fixtures with a freshly bootstrapped cross toolchain.
  #
  # HONESTY: these binaries are NOT the recorded SASH-ENT-002/003 hashes.
  # Microsoft republishes SDK/CRT cab content in place, so a fresh download
  # cannot reproduce the host's pinned-sysroot snapshot byte-for-byte (486 of
  # 523 x64 libs drifted between November and this bootstrap). The recorded
  # hash reproduction stays a host-pinned gate
  # (crates/sash/tests/link_reproduction.rs). CI asserts the structural gates
  # only: PE policy PASS, verify exit 3, the correct machine, presentation
  # profile, and api floor.
  link-artifacts:
    name: Link ${{ matrix.profile }} (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            profile: static-window
            scene: crates/sash/fixtures/static-window.gscene
            triple: x86_64-pc-windows-msvc
            floor: win10
          - arch: x64
            profile: interactive-cut
            scene: crates/sash/fixtures/interactive-counter.gscene
            triple: x86_64-pc-windows-msvc
            floor: win10
          - arch: i686
            profile: static-window
            scene: crates/sash/fixtures/static-window.gscene
            triple: i686-pc-windows-msvc
            floor: win10
          - arch: i686
            profile: interactive-cut
            scene: crates/sash/fixtures/interactive-counter.gscene
            triple: i686-pc-windows-msvc
            floor: win10
          - arch: arm64
            profile: static-window
            scene: crates/sash/fixtures/static-window.gscene
            triple: aarch64-pc-windows-msvc
            floor: win10
          - arch: arm64
            profile: interactive-cut
            scene: crates/sash/fixtures/interactive-counter.gscene
            triple: aarch64-pc-windows-msvc
            floor: win10
          - arch: x64
            profile: legacy-static
            scene: crates/sash/fixtures/static-window.gscene
            triple: x86_64-pc-windows-msvc
            floor: win8
          - arch: i686
            profile: legacy-static
            scene: crates/sash/fixtures/static-window.gscene
            triple: i686-pc-windows-msvc
            floor: win8
          - arch: x64
            profile: legacy-interactive
            scene: crates/sash/fixtures/interactive-counter.gscene
            triple: x86_64-pc-windows-msvc
            floor: win8
          - arch: i686
            profile: legacy-interactive
            scene: crates/sash/fixtures/interactive-counter.gscene
            triple: i686-pc-windows-msvc
            floor: win8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Windows cross toolchain
        run: |
          rustup target add x86_64-pc-windows-msvc i686-pc-windows-msvc aarch64-pc-windows-msvc
          sudo apt-get update
          sudo apt-get install -y llvm-18 clang-18
          # cargo-xwin invokes `llvm-rc` and `clang` unversioned; Ubuntu ships
          # them under /usr/lib/llvm-18/bin.
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"

      - name: Install cargo-xwin and xwin
        run: |
          cargo install cargo-xwin --locked
          cargo install xwin --locked

      - name: Restore bootstrapped Windows sysroot
        id: sysroot
        uses: actions/cache@v4
        with:
          path: ~/sysroot
          key: sash-windows-msvc-sysroot-v1

      - name: Bootstrap the pinned Windows sysroot (first run only)
        if: steps.sysroot.outputs.cache-hit != 'true'
        run: |
          # Recipe proven end-to-end on 2026-11-18 (xwin 0.10.0):
          # splat produces crt/ + sdk/ trees; Sash requires a merged layout
          # with per-rust-triple lib directories and a DONE marker.
          CACHE="$HOME/.cache/xwin"
          mkdir -p "$CACHE"
          xwin --accept-license --cache-dir "$CACHE/download" \
            --arch x86_64 --arch x86 --arch aarch64 \
            splat --output "$CACHE/splat"
          INNER="$CACHE/splat"
          mkdir -p ~/sysroot/windows-msvc-sysroot/lib
          for pair in "x86_64-unknown-windows-msvc x86_64" "i686-unknown-windows-msvc x86" "aarch64-unknown-windows-msvc aarch64"; do
            set -- $pair
            mkdir -p ~/sysroot/windows-msvc-sysroot/lib/$1
            cp -a "$INNER"/crt/lib/$2/* ~/sysroot/windows-msvc-sysroot/lib/$1/
            cp -a "$INNER"/sdk/lib/ucrt/$2/* ~/sysroot/windows-msvc-sysroot/lib/$1/
            cp -a "$INNER"/sdk/lib/um/$2/* ~/sysroot/windows-msvc-sysroot/lib/$1/
          done
          mkdir -p ~/sysroot/windows-msvc-sysroot/include
          cp -a "$INNER"/crt/include/* ~/sysroot/windows-msvc-sysroot/include/
          cp -a "$INNER"/sdk/include/ucrt/* ~/sysroot/windows-msvc-sysroot/include/
          cp -a "$INNER"/sdk/include/shared/* ~/sysroot/windows-msvc-sysroot/include/
          cp -a "$INNER"/sdk/include/um/* ~/sysroot/windows-msvc-sysroot/include/
          touch ~/sysroot/windows-msvc-sysroot/DONE
          # The pinned linker: a symlink to this toolchain's rust-lld.
          ln -s "$(rustc --print sysroot)/lib/rustlib/x86_64-unknown-linux-gnu/bin/rust-lld" \
            ~/sysroot/lld-link
          du -sh ~/sysroot

      - name: Republish the bootstrapped sysroot where Sash looks for it
        run: |
          mkdir -p "$HOME/.cache/xwin"
          rm -rf "$HOME/.cache/xwin/windows-msvc-sysroot" "$HOME/.cache/xwin/lld-link"
          cp -al ~/sysroot/windows-msvc-sysroot "$HOME/.cache/xwin/windows-msvc-sysroot"
          ln -s ~/sysroot/lld-link "$HOME/.cache/xwin/lld-link"

      - name: Link the artifact
        run: |
          cargo run -q -p sash -- \
            build "${{ matrix.scene }}" \
            --profile portable-native --release \
            --api-floor ${{ matrix.floor }} \
            --out ./artifacts/${{ matrix.arch }}/${{ matrix.profile }} \
            --target ${{ matrix.triple }}

      - name: Verify the artifact structurally
        run: |
          sash_bin=target/debug/sash
          $sash_bin verify \
            ./artifacts/${{ matrix.arch }}/${{ matrix.profile }}/App.exe \
            --evidence ./artifacts/${{ matrix.arch }}/${{ matrix.profile }}/evidence \
            --target ${{ matrix.triple }} --api-floor ${{ matrix.floor }} \
            --format json | tee verify.json
          # Structural gates only: PE PASS, runtime and release BLOCKED, and
          # the image must report the requested machine, profile, and floor.
          jq -e '.pe_structure == "PASS" and .runtime_qualification == "BLOCKED" and .release_admission == "BLOCKED" and .target == "${{ matrix.triple }}" and .api_floor == "${{ matrix.floor }}"' verify.json > /dev/null

      - name: Generate expectations.json from the compiler
        run: |
          cargo run -q -p sash -- \
            expectations "${{ matrix.scene }}" --api-floor ${{ matrix.floor }} --format json \
            > ./artifacts/${{ matrix.arch }}/${{ matrix.profile }}/expectations.json
          python3 -m json.tool ./artifacts/${{ matrix.arch }}/${{ matrix.profile }}/expectations.json > /dev/null

      - name: Upload artifact for Windows runners
        uses: actions/upload-artifact@v4
        with:
          name: sash-${{ matrix.arch }}-${{ matrix.profile }}
          path: ./artifacts/${{ matrix.arch }}/${{ matrix.profile }}/*
          retention-days: 7

  windows-test:
    name: Windows Test (${{ matrix.arch }}/${{ matrix.profile }})
    needs: link-artifacts
    runs-on: [self-hosted, windows, "${{ matrix.arch }}"]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            profile: static-window
            runner_label: x64
          - arch: x64
            profile: interactive-cut
            runner_label: x64
          - arch: i686
            profile: static-window
            runner_label: i686
          - arch: i686
            profile: interactive-cut
            runner_label: i686
          - arch: arm64
            profile: static-window
            runner_label: arm64
          - arch: arm64
            profile: interactive-cut
            runner_label: arm64
    steps:
      - name: Checkout repository (for harness scripts)
        uses: actions/checkout@v4

      - name: Setup test directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\sash-test\artifacts\${{ matrix.arch }}\${{ matrix.profile }} | Out-Null
          New-Item -ItemType Directory -Force -Path C:\sash-test\results | Out-Null
          New-Item -ItemType Directory -Force -Path C:\sash-test\logs | Out-Null
          New-Item -ItemType Directory -Force -Path C:\sash-test\harness | Out-Null

      - name: Copy harness scripts
        shell: pwsh
        run: |
          Copy-Item -Path ${{ github.workspace }}\docs\sash\phase0\harness\* -Destination C:\sash-test\harness\ -Recurse -Force

      - name: Download artifact from Linux (via workflow artifact)
        uses: actions/download-artifact@v4
        with:
          name: sash-${{ matrix.arch }}-${{ matrix.profile }}
          path: C:\sash-test\artifacts\${{ matrix.arch }}\${{ matrix.profile }}

      - name: Verify downloaded artifact
        shell: pwsh
        run: |
          $binary = "C:\sash-test\artifacts\${{ matrix.arch }}\${{ matrix.profile }}\App.exe"
          if (-not (Test-Path $binary)) {
            throw "Artifact not found at $binary"
          }
          $hash = (Get-FileHash -Algorithm SHA256 $binary).Hash
          Write-Host "Artifact SHA256: $hash"

      - name: Run master test suite
        id: test
        shell: pwsh
        continue-on-error: true
        run: |
          $skipDpi = '${{ inputs.skip_dpi }}' -eq 'true' -or '${{ matrix.arch }}' -eq 'i686'
          $params = @{
            Arch = '${{ matrix.arch }}'
            Profile = '${{ matrix.profile }}'
            ResultsDir = 'C:\sash-test\results'
          }
          if ($skipDpi) { $params.SkipDpi = $true }

          & "C:\sash-test\harness\run_all_tests.ps1" @params
          $exitCode = $LASTEXITCODE
          echo "exit_code=$exitCode" >> $env:GITHUB_OUTPUT
          exit $exitCode

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase0-results-${{ matrix.arch }}-${{ matrix.profile }}
          path: |
            C:\sash-test\results\${{ matrix.arch }}-${{ matrix.profile }}*
            C:\sash-test\logs\${{ matrix.arch }}-${{ matrix.profile }}*
          retention-days: 30

      - name: Upload evidence JSON
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase0-evidence-${{ matrix.arch }}-${{ matrix.profile }}
          path: C:\sash-test\results\${{ matrix.arch }}-${{ matrix.profile }}*evidence.json
          retention-days: 90

  # Smoke tier: first-launch evidence on a GitHub-hosted runner.
  #
  # A hosted runner carries developer tools and is NOT a clean machine, so
  # this job never clears S1-EXE or any Phase 1 gate. It records only that a
  # real Windows session could create the window, find the controls, and exit
  # cleanly. Qualification stays with the self-hosted windows-test job.
  windows-smoke:
    name: Windows Smoke Launch (windows-latest, x64)
    needs: link-artifacts
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository (for harness scripts)
        uses: actions/checkout@v4

      - name: Setup smoke directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\sash-test\artifacts\x64\static-window | Out-Null
          New-Item -ItemType Directory -Force -Path C:\sash-test\artifacts\x64\interactive-cut | Out-Null
          New-Item -ItemType Directory -Force -Path C:\sash-test\harness | Out-Null

      - name: Copy harness scripts
        shell: pwsh
        run: |
          Copy-Item -Path ${{ github.workspace }}\docs\sash\phase0\harness\smoke_launch.ps1 -Destination C:\sash-test\harness\ -Force

      # Two explicit downloads: merging would collide App.exe from both
      # artifacts, since each stores its files at the artifact root.
      - name: Download static-window artifact
        uses: actions/download-artifact@v4
        with:
          name: sash-x64-static-window
          path: C:\sash-test\artifacts\x64\static-window

      - name: Download interactive-cut artifact
        uses: actions/download-artifact@v4
        with:
          name: sash-x64-interactive-cut
          path: C:\sash-test\artifacts\x64\interactive-cut

      - name: Smoke launch static window
        shell: pwsh
        run: |
          & C:\sash-test\harness\smoke_launch.ps1 -ArtifactDir C:\sash-test\artifacts\x64\static-window
          exit $LASTEXITCODE

      - name: Smoke launch interactive counter
        shell: pwsh
        run: |
          & C:\sash-test\harness\smoke_launch.ps1 -ArtifactDir C:\sash-test\artifacts\x64\interactive-cut
          exit $LASTEXITCODE

      - name: Upload smoke evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase0-smoke-evidence-x64
          path: |
            C:\sash-test\artifacts\x64\static-window\smoke_evidence.json
            C:\sash-test\artifacts\x64\interactive-cut\smoke_evidence.json
          retention-days: 90

  # Consolidate evidence and determine Phase 0 gate
  consolidate:
    name: Consolidate Evidence & Gate
    needs: [link-artifacts, windows-test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      phase0_status: ${{ steps.gate.outputs.phase0_status }}
      evidence_path: ${{ steps.gate.outputs.evidence_path }}
    steps:
      - name: Download all evidence artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: phase0-evidence-*
          path: ./phase0_evidence
          merge-multiple: true

      - name: Run evidence collector
        id: collect
        run: |
          python3 ${{ github.workspace }}/docs/sash/phase0/harness/collect_evidence.py \
            --results-dir ./phase0_evidence \
            --output-dir ./phase0_consolidated \
            --arches x64 i686 arm64 \
            --profiles static-window interactive-cut

      - name: Determine Phase 0 gate
        id: gate
        run: |
          REPORT=$(cat ./phase0_consolidated/phase0_consolidated_report.json)
          OVERALL=$(echo "$REPORT" | jq -r '.overall_status')
          echo "phase0_status=$OVERALL" >> $GITHUB_OUTPUT
          echo "evidence_path=./phase0_consolidated/phase0_consolidated_report.json" >> $GITHUB_OUTPUT

          echo "=== Phase 0 Gate Decision ==="
          echo "Overall: $OVERALL"
          echo "$REPORT" | jq '.gates'

          if [[ "$OVERALL" == "PASS" ]]; then
            echo "✅ Phase 0 PASSED - Ready for Phase 1"
          else
            echo "❌ Phase 0 FAILED - Do not proceed to Phase 1"
            exit 1
          fi

      - name: Upload consolidated report
        uses: actions/upload-artifact@v4
        with:
          name: phase0-consolidated-report
          path: ./phase0_consolidated/phase0_consolidated_report.json
          retention-days: 90

  # Artifact preparation for Windows runners (separate job to run on Linux)
  phase0-gate:
    name: Phase 0 Gate Summary
    needs: [consolidate, windows-smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report Phase 0 Status
        run: |
          STATUS="${{ needs.consolidate.outputs.phase0_status }}"
          echo "## Phase 0 Validation Result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** $STATUS" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          SMOKE="${{ needs.windows-smoke.result }}"
          echo "**Windows smoke tier (windows-latest, x64):** $SMOKE - informational only. A hosted runner is not a clean machine; smoke never clears S1-EXE or the Phase 1 gates. Qualification requires the self-hosted windows-test job on provisioned hardware." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "$STATUS" == "PASS" ]]; then
            echo "✅ **Phase 0 PASSED** - All architectures and profiles validated on clean Windows machines." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Gates Cleared:" >> $GITHUB_STEP_SUMMARY
            echo "- static-window x64, i686, arm64" >> $GITHUB_STEP_SUMMARY
            echo "- interactive-cut x64, i686, arm64" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Next:** Proceed to Phase 1 (Swarm J/B/I - Static-Window Runtime Qualification)" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Phase 0 FAILED** - One or more architecture/profile combinations failed." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Action Required:** Review evidence, fix issues, re-run Phase 0." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi